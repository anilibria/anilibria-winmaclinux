name: UnfoldedRelease

on:
  push:
    branches: [ "master" ]
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore unfolded/Aniliberty.Unfolded.csproj
    - name: Publish x64 application
      run: dotnet publish -r win-x64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - name: Publish arm64 application
      run: dotnet publish -r win-arm64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - name: Upload x64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows64
        path:  unfolded/bin/Release/net10.0/win-x64/native/Aniliberty.Unfolded.exe
    - name: Upload arm64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windowsarm64
        path: unfolded/bin/Release/net10.0/win-arm64/native/Aniliberty.Unfolded.exe
  macos:
    runs-on: macos-latest    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore unfolded/Aniliberty.Unfolded.csproj
    - name: Publish x64 application
      run: dotnet publish -r osx-x64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - name: Publish arm64 application
      run: dotnet publish -r osx-arm64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - name: Merge to single binary
      run: lipo -create -output Aniliberty.Unfolded unfolded/bin/Release/net10.0/osx-arm64/native/Aniliberty.Unfolded unfolded/bin/Release/net10.0/osx-x64/native/Aniliberty.Unfolded
    - name: Code sign
      run: codesign --force --sign - Aniliberty.Unfolded
    - name: Upload x64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macosmultiarch
        path: Aniliberty.Unfolded
  linux64:
    runs-on: ubuntu-latest   
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Publish x64 application
      run: dotnet publish -r linux-x64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - uses: actions/upload-artifact@v6
      with:
        name: linux64
        path: unfolded/bin/Release/net10.0/linux-x64/native/Aniliberty.Unfolded
  linuxarm64:
    runs-on: ubuntu-26.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Publish x64 application
      run: dotnet publish -r linux-arm64 -c Release --self-contained true unfolded/Aniliberty.Unfolded.csproj
    - uses: actions/upload-artifact@v6
      with:
        name: linuxarm64
        path: unfolded/bin/Release/net10.0/linux-arm64/native/Aniliberty.Unfolded
