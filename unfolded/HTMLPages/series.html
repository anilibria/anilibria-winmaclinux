<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>Связанные релизы</title>
	<link rel="icon" type="image/x-icon" href="/static/icons/logo/default.svg">
	<link rel="stylesheet" href="main.css">
	<link rel="stylesheet" href="mainmenu.css">
	<link rel="stylesheet" href="pagestructure.css">
	<link rel="stylesheet" href="styles/releaselist.css">
	<script type="importmap">
		{
		  "imports": {
			"vue": "./vue.js"
		  }
		}
	</script>
</head>
<body>
	<div id="app">
		<page-header v-model:main-menu-visible="mainMenuVisible" title="Связанные релизы">
		</page-header>

		<div class="page-content-with-panel">
			<div class="left-panel flex-column">
				<releases-sidebar-actions
					:selected-releases="selectedReleases"
					:releases-list="releasesList"
					:filter-model="filterModel">
				</releases-sidebar-actions>
				<releases-side-bar-search
					:releases-list="releasesList"
					:filter-model="filterModel">
				</releases-side-bar-search>
			</div>
			<div class="right-content">
				<releases-toolbar :filter-model="filterModel" :releases-list="releasesList">
				</releases-toolbar>
				<releases-list
					v-model:allfilters="filterModel"
					v-model:releasesselected="selectedReleases"
					v-model:backtotopvisible="backToTopVisible"
					:sourcepage="'releases'"
					:item-height="290"
					@openrelease="openReleaseCardByLink($event);"
					ref="releasesList">
					<template v-slot:release="{ release, isSelected, inCinemahall, inFavorites, seensCount, hasactivetorrent, torrentcount, torrentdownloaded }">
						<div class="releaseslist-release-item" :class="{'releaseslist-release-item-selected': isSelected }" :title="release.description">
							<img class="poster" :src="'https://anilibria.top/' + release.poster" loading="lazy"/>
							<div class="information">
								<span class="header-text" style="margin-top: 10px;">{{ release.title }}</span>
								<span class="normal-text">{{ release.status }} {{ release.season ? '- ' + release.season : '' }} {{ release.year }}</span>
								<span class="normal-text">{{ release.type }} <span v-if="release.type !== 'Фильм'" class="normal-text">{{ release.series }}</span> {{ release.genres ? '- ' + release.genres.join(', ') : '' }}</span>
								<span class="normal-text"><b>Команда:</b> {{ release.voices ? release.voices.join(', ') : '' }}</span>
								<span class="digit-text flex-row flex-base-center gap-4">
									<release-list-item-video-info
										v-if="settings.useOnlyOnline || !hasactivetorrent"
										:release="release"
										:open-link-mode="settings.openLinkMode"
										:seens-count="seensCount"
										videomode="release">
									</release-list-item-video-info>
									<release-list-item-torrent-info
										v-if="!settings.useOnlyOnline && hasactivetorrent"
										:release="release"
										:hasactivetorrent="hasactivetorrent"
										:use-internal-torrect-client="releasesList.torrentSettings.useInternalTorrectClient"
										:torrentcount="torrentcount"
										:torrentdownloaded="torrentdownloaded"
										:open-link-mode="settings.openLinkMode"
										videomode="downloadedtorrent">
									</release-list-item-torrent-info>
									<img
										class="clickable-image"
										src="/static/icons/releases/favorite.svg"
										width="20"
										height="20"
										loading="lazy"
										:title="inFavorites ? 'Удалить релиз из избранных' : 'Добавить релиз в избранное'"
										@click.stop="toggleReleaseInFavorites(release.id)"
									/>
									<span>{{ release.rating }}</span>
									<img v-if="release.publishDay" src="/static/icons/releases/scheduleday.svg" width="20" height="20" loading="lazy" />
									<span v-if="release.publishDay">{{ getPublishDay(release.publishDay) }}</span>
								</span>
								<div class="flex-1"></div>
								<div class="flex-row flex-base-center">
									<span v-if="inFavorites || inCinemahall" class="header-text" style="margin-bottom: 4px;">
										{{ 'В ' + (inFavorites ? 'Избранном' : '') + (inCinemahall ? (inFavorites ? ' и ' : '') + 'Кинозале' : '') }}
									</span>
									<div class="flex-1"></div>
									<img
										v-if="isSelected"
										style="margin-right: 4px; margin-bottom: 4px;"
										src="/static/icons/releases/selecteditem.svg"
										width="24"
										height="24"
										loading="lazy"
									/>
								</div>
							</div>
						</div>
					</template>
				</releases-list>
			</div>
		</div>

		<back-to-topmenu :releasesList="releasesList" :backToTopVisible="backToTopVisible">
		</back-to-topmenu>

		<page-drawer v-model:main-menu-visible="mainMenuVisible">
		</page-drawer>
	</div>

	<script type="module">
		import { createApp, ref, useTemplateRef } from 'vue'
		import {
			getRelease
		} from './unfoldapi.js'
		import Drawer from './components/Drawer.js'
		import PageHeader from './components/PageHeader.js'
		import ReleasesList from './components/ReleasesList.js'
		import ReleasesToolBar from './components/ReleasesToolBar.js'
		import ReleasesSideBarActions from './components/ReleasesSideBarActions.js'
		import ReleasesSideBarSearch from './components/ReleasesSideBarSearch.js'
		import ReleaseListItemTorrentInfo from './components/ReleaseListItemTorrentInfo.js'
		import ReleaseListItemVideoInfo from './components/ReleaseListItemVideoInfo.js'
		import BackToTopMenu from './components/BackToTopMenu.js'
		import { getPublishDay } from './releaseDictionaries.js'

		const app = createApp({
			components: {
				'page-drawer': Drawer,
				'page-header': PageHeader,
				'releases-list': ReleasesList,
				'releases-toolbar': ReleasesToolBar,
				'releases-sidebar-actions': ReleasesSideBarActions,
				'releases-side-bar-search': ReleasesSideBarSearch,
				'release-list-item-torrent-info': ReleaseListItemTorrentInfo,
				'release-list-item-video-info': ReleaseListItemVideoInfo,
				'back-to-topmenu': BackToTopMenu
			},
			setup() {
				const selectedReleases = ref([]);
				const filterModel = ref({});
				const mainMenuVisible = ref(false);
				const releasesList = useTemplateRef('releasesList');
				const backToTopVisible = ref(false);
				const settings = ref({ startedSection: 0, startedSubSection: -1, notificationMode: 0, openLinkMode: 0 });

				async function toggleReleaseInFavorites(id) {
					await releasesList.value.toggleReleaseInFavorites(id);
				}

				async function loadData() {
					settings.value = await getPageSettings('cinemahall');
					await isSometingInCinemahall();
				}				

				return {
					mainMenuVisible,
					selectedReleases,
					filterModel,
					releasesList,
					backToTopVisible,
					settings,
					toggleReleaseInFavorites,
					getPublishDay
				}
			}
		});

		app.mount('#app')
	</script>
</body>
</html>
