<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>Каталог релизов</title>
	<link rel="icon" type="image/x-icon" href="/static/icons/logo/default.svg">
	<link rel="stylesheet" href="main.css">
	<link rel="stylesheet" href="mainmenu.css">
	<link rel="stylesheet" href="pagestructure.css">
	<link rel="stylesheet" href="styles/releases.css">
	<link rel="stylesheet" href="styles/releaselist.css">
	<link rel="stylesheet" href="libs/multiselect.css">
	<script type="importmap">
		{
		  "imports": {
			"vue": "./vue.js"
		  }
		}
	</script>

</head>
<body>
	<div id="app">
		<page-header v-model:main-menu-visible="mainMenuVisible"
					 title="Каталог релизов">
		</page-header>

		<div class="page-content-with-panel">
			<div class="left-panel flex-column">
				<div class="simple-panel-icon-button simple-popup-container"
					 title="Выполнить синхронизация релизов">
					<div class="full-width-height flex-row flex-base-center flex-other-center">
						<img :src="'/static/icons/releases/synchronization.svg'" width="30" height="30" />
					</div>
				</div>
				<releases-sidebar-actions
					:selected-releases="selectedReleases"
					:releases-list="releasesList"
					:filter-model="filterModel">
				</releases-sidebar-actions>
				<releases-side-bar-search
					:releases-list="releasesList"
					:filter-model="filterModel">
				</releases-side-bar-search>
				<div v-if="notificationMessage" class="simple-panel-icon-button"
					 :title="notificationMessage"
					 @click="loadNotifications()">
					<div class="full-width-height flex-row flex-base-center flex-other-center">
						<img class="releases-bell-animation" :src="'/static/icons/releases/notifications.svg'" width="30" height="30" />
					</div>
				</div>
				<div class="simple-panel-icon-button simple-popup-container" title="Открыть карточку релиза выбранного случайным образом">
					<div class="full-width-height flex-row flex-base-center flex-other-center">
						<img :src="'/static/icons/releases/random.svg'" width="30" height="30" />
					</div>
					<div class="simple-popup-box releases-rightmenu">
						<div class="releases-rightmenu-random flex-column">
							<a class="default-link" @click.prevent="openRandomRelease()" href="">По всем релизам</a>
							<a class="default-link" @click.prevent="openRandomReleaseInSelection()" href="">Из выбранного</a>
						</div>
					</div>
				</div>
				<div class="simple-panel-icon-button simple-popup-container" title="Настройка страницы Каталог релизов">
					<div class="full-width-height flex-row flex-base-center flex-other-center">
						<img :src="'/static/icons/commonbuttons/settings.svg'" width="30" height="30" />
					</div>
					<div class="simple-popup-box releases-rightmenu">
						<div class="releases-rightmenu-settings flex-column gap-8">
							<div>Стартовая секция:</div>
							<div class="flex-row flex-base-center">
								<simple-select v-model:item="settings.startedSection"
											   :options="sections"
											   style="width: 130px;"
											   @selected="settings.startedSubSection = -1; saveReleasesSettings();">
								</simple-select>
								<div v-if="settings.startedSection >= 6 && settings.startedSection < 9" style="margin-left: 4px; margin-right: 4px;">-</div>
								<simple-select v-if="settings.startedSection === 6" v-model:item="settings.startedSubSection"
											   :options="historySections"
											   style="width: 170px;"
											   @selected="saveReleasesSettings()">
								</simple-select>
								<simple-select v-if="settings.startedSection === 7" v-model:item="settings.startedSubSection"
											   :options="seenMarkSections"
											   style="width: 225px;"
											   @selected="saveReleasesSettings()">
								</simple-select>
								<simple-select v-if="settings.startedSection === 8" v-model:item="settings.startedSubSection"
											   :options="setsSections"
											   style="width: 220px;"
											   @selected="saveReleasesSettings()">
								</simple-select>
							</div>
							<div>Уведомления:</div>
							<simple-select v-model:item="settings.notificationMode" :options="notificationModes" style="width: 100%;" @selected="saveReleasesSettings()">
							</simple-select>
							<div>Открывать ссылки:</div>
							<simple-select v-model:item="settings.openLinkMode" :options="openLinkMode" style="width: 100%;" @selected="saveReleasesSettings()">
							</simple-select>
						</div>
					</div>
				</div>
			</div>
			<div class="right-content">
				<releases-toolbar :filter-model="filterModel" :releases-list="releasesList">
				</releases-toolbar>
				<releases-list
					v-model:allfilters="filterModel"
					v-model:releasesselected="selectedReleases"
					v-model:backtotopvisible="backToTopVisible"
					:sourcepage="'releases'"
					:item-height="290"
					@openrelease="openReleaseCardByLink($event);"
					ref="releasesList">
					<template v-slot:release="{ release, isSelected, inCinemahall, inFavorites, seensCount }">
						<div class="releaseslist-release-item" :class="{'releaseslist-release-item-selected': isSelected }">
							<img class="poster" :src="'https://anilibria.top/' + release.poster" loading="lazy"/>
							<div class="information">
								<span class="header-text" style="margin-top: 10px;">{{ release.title }}</span>
								<span class="normal-text">{{ release.status }} {{ release.season ? '- ' + release.season : '' }} {{ release.year }}</span>
								<span class="normal-text">{{ release.type }} {{ release.series }} {{ release.genres ? '- ' + release.genres.join(', ') : '' }}</span>
								<span class="normal-text"><b>Команда:</b> {{ release.voices ? release.voices.join(', ') : '' }}</span>
								<span class="digit-text flex-row flex-base-center gap-4">
									<img
										class="clickable-image"
										src="/static/icons/releases/online.svg"
										width="20"
										height="20"
										@click.stop="openInVideoPlayer(release.id)"
										title="Открыть релиз в видеоплеере"
										loading="lazy"
									/>
									<span>{{ release.countVideos }}{{ seensCount > 0 ? '/' + seensCount : '' }}</span>
									<img
										v-if="release.countTorrents > 0"
										class="clickable-image"
										src="/static/icons/mainmenu/torrent.svg"
										width="20"
										height="20"
										loading="lazy"
										title="Скачать релиз через торрент"
										@click.stop="downloadInTorrent(release.id)"
									/>
									<div v-if="release.countTorrents > 0">
										{{ formatCodecs(release.codecs) }}
									</div>
									<img
										class="clickable-image"
										src="/static/icons/releases/favorite.svg"
										width="20"
										height="20"
										loading="lazy"
										:title="inFavorites ? 'Удалить релиз из избранных' : 'Добавить релиз в избранное'"
										@click.stop="toggleReleaseInFavorites(release.id)"
									/>
									<span>{{ release.rating }}</span>
									<img v-if="release.publishDay" src="/static/icons/releases/scheduleday.svg" width="20" height="20" loading="lazy" />
									<span v-if="release.publishDay">{{ getPublishDay(release.publishDay) }}</span>
								</span>
								<div class="flex-1"></div>
								<div class="flex-row flex-base-center">
									<span v-if="inFavorites || inCinemahall" class="header-text" style="margin-bottom: 4px;">
										{{ 'В ' + (inFavorites ? 'Избранном' : '') + (inCinemahall ? (inFavorites ? ' и ' : '') + 'Кинозале' : '') }}
									</span>
									<div class="flex-1"></div>
									<img
										v-if="isSelected"
										style="margin-right: 4px; margin-bottom: 4px;"
										src="/static/icons/releases/selecteditem.svg"
										width="24"
										height="24"
										loading="lazy"
									/>
								</div>
							</div>
						</div>
					</template>
				</releases-list>
			</div>
		</div>

		<div v-if="releasesList" :class="{'releases-selection-helper': true, 'releases-pulse-animation': releasesList.selectionModeEnabled }">
			{{ releasesList.selectionModeEnabled ? 'Нажмите ЛКМ для выделения релизов, ПКМ для выхода' : 'Нажмите ПКМ для перехода в режим выделения' }}
		</div>
		<div v-if="backToTopVisible" class="releases-backtotop-helper flex-row flex-base-center flex-other-center" @click="backToTop()">
			<img src="/static/icons/commonbuttons/arrowup.svg" width="20" height="20" />
		</div>

		<page-drawer v-model:main-menu-visible="mainMenuVisible">
		</page-drawer>
	</div>

	<script type="module">
		import { createApp, ref, watch, useTemplateRef, onMounted } from 'vue'
		import {
			getRelasesByFilter, getPageSettings,
			saveSettings, getReleaseNotifications, getRandomReleaseFromAll, getRandomRelease, addFavorites, removeFavorites,
			getHidedReleases, addHidedReleases, downloadTorrent
		} from './unfoldapi.js'
		import { sections, historySections, seenMarkSections, setsSections } from '/static/releaseDictionaries.js'
		import Drawer from './components/Drawer.js'
		import PageHeader from './components/PageHeader.js'
		import SimpleSelect from './components/SimpleSelect.js'
		import ReleasesList from './components/ReleasesList.js'
		import ReleasesToolBar from './components/ReleasesToolBar.js'
		import ReleasesSideBarActions from './components/ReleasesSideBarActions.js'
		import ReleasesSideBarSearch from './components/ReleasesSideBarSearch.js'

		const app = createApp({
			components: {
				'page-drawer': Drawer,
				'page-header': PageHeader,
				'simple-select': SimpleSelect,
				'releases-list': ReleasesList,
				'releases-toolbar': ReleasesToolBar,
				'releases-sidebar-actions': ReleasesSideBarActions,
				'releases-side-bar-search': ReleasesSideBarSearch
			},
			setup() {
				const mainMenuVisible = ref(false);
				const torrentSettings = ref({});
				const selectionModeEnabled = ref(false);
				const selectedReleases = ref([]);
				const releasesList = useTemplateRef('releasesList');
				const notificationMessage = ref('');
				const backToTopVisible = ref(false);
				let currentTimer = -1;
				const settings = ref({ startedSection: 0, startedSubSection: -1, notificationMode: 0, openLinkMode: 0 });
				const filterModel = ref({});

				const notificationModes = [
					{
						title: "Выключены",
						id: 0
					},
					{
						title: "Уведомления по всем релизам",
						id: 1
					},
					{
						title: "Уведомления только по избранному",
						id: 2
					},
				];

				const openLinkMode = [
					{
						title: "В текущем окне",
						id: 0
					},
					{
						title: "В новом окне",
						id: 1
					}
				];

				async function saveReleasesSettings() {
					await saveSettings('releases', settings.value);
				}

				function getPublishDay(value) {
					switch (value) {
						case 1: return 'пн';
						case 2: return 'вт';
						case 3: return 'ср';
						case 4: return 'чт';
						case 5: return 'пт';
						case 6: return 'сб';
						case 7: return 'вс';
						default: return '';
					}
				}

				function openInVideoPlayer(id) {
					if (settings.value.openLinkMode) {
						window.open("videoplayer.html?mode=release&id=" + id, '_blank');
					} else {
						window.location.href = 'videoplayer.html?mode=release&id=' + id;
					}
				}

				async function downloadInTorrent(id) {
					if (torrentSettings.value.useInternalTorrectClient) {
						await downloadTorrent(id);
					} else {
						//TODO: show torrent dialog
						//await openInExternalTorrentClient(id, '');
					}
				}

				function loadNotifications() {
					filterModel.value.section = 2;
					filterModel.value.subsection = -1;
					releasesList.value.loadReleases();
				}

				function backToTop() {
					releasesList.value.backToTop();
				}

				function openReleaseCardByLink(id) {
					if (settings.value.openLinkMode) {
						window.open("releasecard.html?id=" + id, '_blank');
					} else {
						window.location.href = "releasecard.html?id=" + id;
					}
				}

				async function openRandomRelease() {
					const id = await getRandomReleaseFromAll();
					openReleaseCardByLink(id);
				}

				async function openRandomReleaseInSelection() {
					const id = await getRandomRelease(getListModel());
					openReleaseCardByLink(id);
				}

				function formatCodecs(codecs) {
					if (!codecs) return '';

					return codecs.map(a => clearCodec(a)).join('/');
				}

				function clearCodec(codec) {
					let res = codec.toLowerCase();
					const index = res.indexOf('/');
					if (index > -1) return res.substring(index + 1);

					return res;
				}

				async function toggleReleaseInFavorites(id) {
					await releasesList.value.toggleReleaseInFavorites(id);
				}
			
				return {
					mainMenuVisible,
					seenMarkSections,
					selectionModeEnabled,
					selectedReleases,
					releasesList,
					sections,
					historySections,
					seenMarkSections,
					setsSections,
					settings,
					notificationModes,
					notificationMessage,
					backToTopVisible,
					filterModel,
					openLinkMode,
					getPublishDay,
					openInVideoPlayer,
					loadNotifications,
					backToTop,
					openRandomRelease,
					openRandomReleaseInSelection,
					saveReleasesSettings,
					formatCodecs,
					downloadInTorrent,
					openReleaseCardByLink,
					toggleReleaseInFavorites
				}
			}
		});

		app.mount('#app')
	</script>
</body>
</html>
